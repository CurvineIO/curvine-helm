# Production environment configuration
# Edit this file before use.
# Requirements:
# - StorageClasses named below must already exist.
# - Node labels and taints must match your cluster.
# - Switch anti-affinity to `required` only after you have enough worker nodes.

cluster:
  id: "curvine-prod"

master:
  replicas: 5

  storage:
    meta:
      enabled: true
      storageClass: "fast-ssd"  # Replace with a real StorageClass in your cluster
      size: "50Gi"
      mountPath: "/opt/curvine/data/meta"

    journal:
      enabled: true
      storageClass: "fast-ssd"  # Replace with a real StorageClass in your cluster
      size: "200Gi"
      mountPath: "/opt/curvine/data/journal"

  resources:
    requests:
      cpu: "2000m"
      memory: "4Gi"
    limits:
      cpu: "4000m"
      memory: "8Gi"

  # Replace these labels with the dedicated control-plane labels in your cluster.
  nodeSelector:
    node-role.kubernetes.io/master: "true"

  tolerations:
    - key: "node-role.kubernetes.io/master"
      operator: "Exists"
      effect: "NoSchedule"

  labels:
    tier: "control-plane"
    env: "production"

worker:
  replicas: 10

  hostNetwork: false
  privileged: true

  storage:
    dataDirs:
      - name: "data1"
        type: "SSD"
        enabled: true
        size: "500Gi"
        storageClass: "fast-ssd"  # Replace with a real StorageClass in your cluster
        mountPath: "/data/data1"

      - name: "data2"
        type: "HDD"
        enabled: true
        size: "2Ti"
        storageClass: "standard-hdd"  # Replace with a real StorageClass in your cluster
        mountPath: "/data/data2"

  resources:
    requests:
      cpu: "4000m"
      memory: "8Gi"
    limits:
      cpu: "8000m"
      memory: "16Gi"

  # Replace these labels with the dedicated worker labels in your cluster.
  nodeSelector:
    node-role.kubernetes.io/worker: "true"

  antiAffinity:
    enabled: true
    type: "preferred"

  labels:
    tier: "data-plane"
    env: "production"

config:
  log:
    level: "INFO"
