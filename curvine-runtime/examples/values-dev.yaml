# Development environment configuration
# Intended for local validation and small non-production clusters.
# Relies on the chart's default image settings.

cluster:
  id: "curvine-dev"

# Single master for development
master:
  replicas: 1

  storage:
    meta:
      enabled: true
      storageClass: ""  # Requires a default StorageClass when hostPath is empty
      size: "5Gi"
      hostPath: ""
      mountPath: "/opt/curvine/data/meta"

    journal:
      enabled: true
      storageClass: ""  # Requires a default StorageClass when hostPath is empty
      size: "10Gi"
      hostPath: ""
      mountPath: "/opt/curvine/data/journal"

  resources:
    requests:
      cpu: "500m"
      memory: "1Gi"
    limits:
      cpu: "1000m"
      memory: "2Gi"

worker:
  replicas: 1

  hostNetwork: false
  privileged: true

  storage:
    dataDirs:
      - name: "data1"
        type: "SSD"
        enabled: true
        size: "20Gi"
        storageClass: ""  # Requires a default StorageClass when hostPath is empty
        hostPath: ""
        mountPath: "/data/data1"

  resources:
    requests:
      cpu: "500m"
      memory: "1Gi"
    limits:
      cpu: "1000m"
      memory: "2Gi"

  antiAffinity:
    enabled: false

config:
  log:
    level: "DEBUG"
