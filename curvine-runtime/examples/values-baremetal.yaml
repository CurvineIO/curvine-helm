# Bare-metal environment configuration
# Edit this file before use.
# Requirements:
# - Each hostPath must exist on every target node or be creatable by kubelet.
# - Nodes must already be labeled with the selectors below.
# - Privileged Pods and host networking must be allowed.

cluster:
  id: "curvine-baremetal"

# Pin master pods to original nodes across restarts (requires Kruise subchart).
openKruise:
  enabled: true

master:
  replicas: 3

  storage:
    meta:
      enabled: true
      storageClass: ""  # Empty means hostPath is used
      size: "20Gi"
      hostPath: "/mnt/curvine/master/meta"  # Replace with a real path on each master node
      mountPath: "/opt/curvine/data/meta"

    journal:
      enabled: true
      storageClass: ""
      size: "100Gi"
      hostPath: "/mnt/curvine/master/journal"  # Replace with a real path on each master node
      mountPath: "/opt/curvine/data/journal"

  resources:
    requests:
      cpu: "2000m"
      memory: "4Gi"
    limits:
      cpu: "4000m"
      memory: "8Gi"

  # Replace these labels with labels that already exist on your master nodes.
  nodeSelector:
    curvine-role: "master"

worker:
  replicas: 5

  hostNetwork: true
  dnsPolicy: "ClusterFirstWithHostNet"
  privileged: true

  storage:
    dataDirs:
      - name: "data1"
        type: "SSD"
        enabled: true
        size: "500Gi"
        storageClass: ""
        hostPath: "/mnt/nvme0n1/curvine"  # Replace with a real path on each worker node
        mountPath: "/data/data1"

      - name: "data2"
        type: "SSD"
        enabled: true
        size: "500Gi"
        storageClass: ""
        hostPath: "/mnt/nvme1n1/curvine"  # Replace with a real path on each worker node
        mountPath: "/data/data2"

  resources:
    requests:
      cpu: "4000m"
      memory: "8Gi"
    limits:
      cpu: "8000m"
      memory: "16Gi"

  # Replace these labels with labels that already exist on your worker nodes.
  nodeSelector:
    curvine-role: "worker"

  antiAffinity:
    enabled: true
    type: "preferred"

config:
  log:
    level: "INFO"
